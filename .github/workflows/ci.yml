name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint & Audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format check
        run: cargo fmt -- --check

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit || true

  frontend:
    name: Frontend tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install test dependencies
        run: npm ci

      # Covers the plugin widget HTML sanitizer and icon-name validation,
      # which stand between an untrusted plugin and the Tauri bridge. These
      # existed but nothing in CI ran them.
      - name: Run frontend tests
        run: npm test

  ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (Tauri/WebKit)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev pkg-config \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Build Java SDK JAR (embedded in binary)
        run: make -C java-sdk build

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --all-targets

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Build Java SDK JAR (embedded in binary)
        run: make -C java-sdk build

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --all-targets

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # Same script the release job and the dev VM run, minus the bundling
      # (-SkipBundle): it compiles termlab_tauri and runs `cargo test`,
      # which includes windows_registration_parity.rs's text-level checks on
      # registration.wxs / installer-hooks.nsh / tauri.conf.json. It does
      # NOT invoke WiX or NSIS, so nothing here actually compiles either
      # file -- a syntax error only WiX's or NSIS's own compiler would catch
      # (as opposed to the parity test's line-based parsing) would slip
      # through PR CI and surface only in the release job's real bundle step.
      - name: Build and test
        shell: pwsh
        # A freshly provisioned runner can default to the Restricted
        # execution policy, which refuses to load any .ps1 at all. Override
        # it for this process only (not machine-wide) before invoking the
        # script, rather than relying on windows-latest happening to allow
        # scripts already.
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          ./scripts/build-windows.ps1 -SkipBundle -Configuration Debug

      - name: Clippy
        run: cargo clippy --all-targets
