# TermLab — Example Configuration
#
# All values shown are the defaults. Uncomment and modify as needed.
# Config location:
#   macOS / Linux: ~/.config/termlab/config.toml
#   Windows:       %APPDATA%\termlab\config.toml
#
# TermLab uses an Alacritty-compatible TOML format with additional [termlab.*] sections.

# ---------------------------------------------------------------------------
# Window
# ---------------------------------------------------------------------------

[window]

# Window decoration style.
# Values: "Full", "Transparent", "Buttonless", "None" (case-insensitive)
#
#   Full        — Standard title bar and borders (default)
#   Transparent — Transparent title bar, content extends behind it (macOS only)
#   Buttonless  — No title bar or buttons, terminal fills the entire window (macOS only)
#   None        — No title bar or borders
#
decorations = "Full"

[window.dimensions]

# Initial window size in character cells. 0 = use system default.
columns = 150
lines = 50

# ---------------------------------------------------------------------------
# Terminal Font
# ---------------------------------------------------------------------------
#
# Terminal font configuration. Controls the monospace font used in the
# terminal grid. (Legacy [font] section is still supported but [terminal.font]
# is preferred.)

[terminal.font]

# Terminal font size in points.
size = 14.0

[terminal.font.normal]

# Terminal font family name.
family = "JetBrains Mono"

[terminal.font.offset]

# Extra pixel spacing added to each character cell.
# x = horizontal pixels per cell, y = vertical pixels per cell.
x = 0.0
y = 0.0

# ---------------------------------------------------------------------------
# Colors
# ---------------------------------------------------------------------------

[colors]

# Color scheme name. Themes are loaded from ~/.config/termlab/themes/<name>.toml.
# Built-ins: "TermLab Dark" and "TermLab Light". The reserved name "auto"
# follows appearance_mode below, picking between those two. An unknown name
# falls back to TermLab Dark.
theme = "auto"

# UI appearance mode: "dark", "light", or "system".
# Controls the native title bar and egui widget styling.
appearance_mode = "dark"

# ---------------------------------------------------------------------------
# Terminal
# ---------------------------------------------------------------------------

[terminal]

# Scroll sensitivity multiplier (0.0–1.0). Lower = slower scrolling.
# Default 0.15, tuned for macOS trackpads. Increase for external mice.
scroll_sensitivity = 0.15

[terminal.shell]

# Shell program to run. Empty string = use default login shell ($SHELL).
program = ""

# Arguments passed to the shell program.
args = []

[terminal.env]

# Extra environment variables set in the terminal.
# TERM and COLORTERM are always set to "xterm-256color" and "truecolor"
# unless overridden here.
#
# Example:
#   EDITOR = "nvim"
#   LANG = "en_US.UTF-8"

[terminal.cursor.style]

# Cursor shape: "Block", "Underline", or "Beam".
shape = "Block"

# Whether the cursor blinks.
# Accepts: true, false, "Always", "On", "Never", "Off"
blinking = true

# Vi mode cursor style (shown when vi mode is active in supported shells).
# Uncomment to override. Same options as [terminal.cursor.style] above.
# [terminal.cursor.vi_mode_style]
# shape = "Block"
# blinking = false

# ---------------------------------------------------------------------------
# Editor
# ---------------------------------------------------------------------------

[editor]

# Use vim keybindings in the built-in editor.
#
# Off by default. When on, `:w` saves through the same path as Cmd+S (a remote
# file is uploaded to its host), and `:q` closes the tab through the same
# guard, so a file with unsaved changes still asks before it goes.
vim_mode = false

# Which view mode a markdown file opens in: "editor", "split" or "preview".
preview_default_mode = "editor"

# ---------------------------------------------------------------------------
# TermLab — Keyboard Shortcuts
# ---------------------------------------------------------------------------
#
# Format: "mod+key" where mod is cmd, ctrl, alt, shift (combine with +).
# On Linux/Windows, "cmd" maps to Ctrl.
#
# Note:
# - Use `cmd` for cross-platform "primary modifier" shortcuts.
# - Use `ctrl` for the literal Control key (for example on macOS: Ctrl+Option+4).

[termlab.keyboard]

new_tab = "cmd+t"
close_tab = "cmd+w"
new_window = "cmd+shift+n"
quit = "cmd+q"
rename_tab = "f2"
zen_mode = "cmd+shift+z"
toggle_left_panel = "cmd+shift+e"
toggle_right_panel = "cmd+shift+r"
toggle_bottom_panel = "cmd+shift+j"
split_vertical = "cmd+d"
split_horizontal = "cmd+shift+d"
close_pane = "cmd+shift+w"
navigate_pane_up = "cmd+alt+up"
navigate_pane_down = "cmd+alt+down"
navigate_pane_left = "cmd+alt+left"
navigate_pane_right = "cmd+alt+right"
# Upgrading: this key used to be called `new_scratch`. The old name still works
# as an alias, but a config carrying BOTH lines fails to parse ("duplicate
# field `new_file`") and the whole file is silently discarded — every setting,
# not just this one, reverts to its default. If you have an old `new_scratch`
# line, delete it.
new_file = "cmd+n"
save_file = "cmd+s"
# Save As — the chooser again, in save mode (filename field, New Folder,
# overwrite prompt). Scoped like save_file: only a focused editor pane
# consumes it, so cmd+shift+s still reaches the shell in a terminal.
save_file_as = "cmd+shift+s"
# Opens the file chooser (This Mac + every connected SSH host). Unlike
# save_file this is not scoped to a focused editor, so it also consumes this
# combo in a terminal pane.
open_file = "cmd+o"
# Cycles a markdown pane's view: editor -> split -> preview. Consumed only by a
# focused editor pane that actually has a preview, so it still reaches the
# shell in a terminal and any tool-window or plugin action bound to the same
# combo. NOT cmd+shift+p — that is the command palette.
toggle_preview = "cmd+shift+y"

# Optional per-plugin shortcut overrides.
# Key format: "<plugin_name>:<action>".
#
# [termlab.keyboard.plugin_shortcuts]
# "My Plugin:do_thing" = "ctrl+alt+4"

# ---------------------------------------------------------------------------
# TermLab — UI Settings
# ---------------------------------------------------------------------------

[termlab.ui]

# UI font family (sidebars, menus, dialogs). Empty string = system default.
font_family = ""

# UI font size in points (used by the egui font system for loading).
font_size = 13.0

# Use the native macOS global menu bar instead of the in-window menu bar.
# Only applies on macOS; ignored on other platforms. Default: true.
native_menu_bar = true

[termlab.ui.font]

# UI chrome font sizes in points. These control the text size of panels,
# trees, tables, buttons, and labels throughout the application.
#
#   small  — compact labels, tab titles, badges
#   list   — tree node labels, table rows and headers (file explorer, SSH tree)
#   normal — body text, buttons, text inputs, dialogs
small = 12.0
list = 14.0
normal = 14.0

# ---------------------------------------------------------------------------
# TermLab — Plugin System
# ---------------------------------------------------------------------------
#
# Control which plugin types are loaded. Disabling plugins you don't use
# reduces startup time and resource usage (e.g. java = false avoids
# starting a JVM entirely).
#
# Set enabled = false to disable the entire plugin engine for a lean
# terminal with no plugin overhead.

[termlab.plugins]

# Master switch: false disables all plugin discovery, loading, and the
# plugin bus. The app runs as a pure terminal emulator.
# Default: true
enabled = true

# Per-type toggles (only relevant when enabled = true).
# Set to false to disable a specific plugin type.
lua = true        # Lua script plugins (.lua)
java = true       # Java JAR plugins (.jar) — disabling skips JVM startup

# Extra directories to scan for plugins. The app always checks built-in
# paths (~/.config/termlab/plugins/, exe directory, etc.). Paths here are
# appended to those defaults.
# search_paths = ["~/my-termlab-plugins"]
