<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TermLab</title>
  <link rel="stylesheet" href="vendor/xterm/xterm.min.css" />
  <link rel="stylesheet" href="styles/design-system/tokens-dark.css" />
  <link rel="stylesheet" href="styles/design-system/tokens-light.css" />
  <link rel="stylesheet" href="styles/design-system/fonts.css" />
  <link rel="stylesheet" href="styles/design-system/base.css" />
  <link rel="stylesheet" href="styles/design-system/components/button.css" />
  <link rel="stylesheet" href="styles/design-system/components/input.css" />
  <link rel="stylesheet" href="styles/design-system/components/scrollbar.css" />
  <link rel="stylesheet" href="styles/design-system/components/toolwindow.css" />
  <link rel="stylesheet" href="styles/design-system/components/strips.css" />
  <link rel="stylesheet" href="styles/design-system/components/menu.css" />
  <link rel="stylesheet" href="styles/design-system/components/dialog.css" />
  <link rel="stylesheet" href="styles/design-system/components/form.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/layout.css" />

  <link rel="stylesheet" href="styles/skins.css" />
</head>
<body>
  <div id="app">
    <div id="drag-handle" data-tauri-drag-region></div>
    <div id="main-area">
      <div id="left-strip" class="side-strip"></div>
      <div id="left-sidebar" class="sidebar-wrap hidden">
        <div id="left-panel-container" class="sidebar-panel">
          <div class="tool-zone" data-zone="left-top">
            <div class="zone-tab-strip hidden"></div>
            <div class="zone-content"></div>
          </div>
          <div id="left-zone-divider" class="zone-divider hidden"></div>
          <div class="tool-zone empty" data-zone="left-bottom">
            <div class="zone-tab-strip hidden"></div>
            <div class="zone-content"></div>
          </div>
        </div>
        <div id="left-sidebar-resize" class="sidebar-resize"></div>
      </div>
      <div id="editor-column">
        <div id="tabbar"></div>
        <div id="terminal-host"></div>
      </div>
      <div id="right-sidebar" class="sidebar-wrap hidden">
        <div id="right-sidebar-resize" class="sidebar-resize"></div>
        <div id="right-panel-container" class="sidebar-panel">
          <div class="tool-zone" data-zone="right-top">
            <div class="zone-tab-strip hidden"></div>
            <div class="zone-content"></div>
          </div>
          <div id="right-zone-divider" class="zone-divider hidden"></div>
          <div class="tool-zone empty" data-zone="right-bottom">
            <div class="zone-tab-strip hidden"></div>
            <div class="zone-content"></div>
          </div>
        </div>
      </div>
      <div id="right-strip" class="side-strip"></div>
    </div>
    <div id="bottom-zone-wrap" class="bottom-zone-wrap hidden">
      <div id="bottom-zone-resize" class="bottom-zone-resize"></div>
      <div class="tool-zone" data-zone="bottom">
        <div class="zone-tab-strip hidden"></div>
        <div class="zone-content"></div>
      </div>
    </div>
    <div id="bottom-strip" class="side-strip side-strip--horizontal"></div>
  </div>
  <div id="status">
    <div id="status-message"></div>
    <button id="status-dismiss" type="button" aria-label="Dismiss error">Dismiss</button>
  </div>

  <!-- Vendored xterm.js (pinned: xterm 5.5.0, fit 0.10.0, web-links 0.11.0,
       unicode11 0.8.0) — see vendor/xterm/LICENSE. -->
  <script src="vendor/xterm/xterm.min.js"></script>
  <script src="vendor/xterm/addon-fit.min.js"></script>
  <script src="vendor/xterm/addon-web-links.min.js"></script>
  <script src="vendor/xterm/addon-unicode11.min.js"></script>
  <!-- WebGL addon removed: system fonts don't reliably load in WebKit's
       canvas context before the WebGL texture atlas is built, causing the
       terminal to render with a fallback font.  The canvas renderer in
       xterm.js 5.x is fast enough for interactive use. -->
  <script src="app/core/utils.js"></script>
  <script src="app/core/tauri-client.js"></script>
