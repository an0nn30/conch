# TermLab Dark — the app's default terminal palette, and the palette the
# reserved theme name `auto` selects under a dark appearance
# (termlab_core::effective_theme::TERMLAB_DARK_THEME).
#
# The values below are a byte-for-byte serialization of
# termlab_core::color_scheme::ColorScheme::default(), TermLab's historical
# hardcoded default palette. It is deliberately NOT the upstream
# alacritty-theme "dracula" palette it descends from — that file remains
# vendored verbatim, parse-fixture-only, at
# crates/termlab_core/tests/fixtures/alacritty-themes/dracula.toml, and
# disagrees with this one on several ANSI slots.
#
# It ships as a file, rather than only as the Default impl, so that TermLab
# Dark enumerates as a real picker entry alongside TermLab Light. Keep this
# file's values in exact sync with ColorScheme::default() in
# crates/termlab_core/src/color_scheme.rs; the two are pinned equal,
# field-for-field, by
# color_scheme::tests::resolve_theme_termlab_dark_is_byte_identical_to_the_hardcoded_default.
#
# Not generated: this file is hand-maintained against the Default impl, not
# emitted by scripts/extract_intellij_tokens.py (which stopped writing a
# terminal TOML when TermLab Dark took over this palette).

[colors.primary]
background = "#282a36"
foreground = "#f8f8f2"
dim_foreground = "#6272a4"
bright_foreground = "#ffffff"

[colors.cursor]
text = "#282a36"
cursor = "#f8f8f2"

[colors.selection]
text = "#f8f8f2"
background = "#44475a"

[colors.normal]
black   = "#21222c"
red     = "#ff5555"
green   = "#50fa7b"
yellow  = "#f1fa8c"
blue    = "#bd93f9"
magenta = "#ff79c6"
cyan    = "#8be9fd"
white   = "#f8f8f2"

[colors.bright]
black   = "#6272a4"
red     = "#ff6e6e"
green   = "#69ff94"
yellow  = "#ffffa5"
blue    = "#d6acff"
magenta = "#ff92df"
cyan    = "#a4ffff"
white   = "#ffffff"
