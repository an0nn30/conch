[workspace]
resolver = "3"
members = [
    "crates/termlab_core",
    "crates/termlab_plugin_sdk",
    "crates/termlab_plugin",
    "crates/termlab_remote",
    "crates/termlab_share",
    "crates/termlab_tauri",
    "crates/termlab_vault",
]

[workspace.package]
version = "3.0.0-rc.1"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# Workspace crates
termlab_core = { path = "crates/termlab_core" }
termlab_plugin_sdk = { path = "crates/termlab_plugin_sdk" }
termlab_plugin = { path = "crates/termlab_plugin" }
termlab_remote = { path = "crates/termlab_remote" }
termlab_tauri = { path = "crates/termlab_tauri" }

# Serialization (shared)
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6.0"
hostname = "0.4"
base64 = "0.22"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
zeroize = "1"
tempfile = "3"
mlua = { version = "0.10", features = ["lua54", "vendored", "send"] }
ts-rs = { version = "12", features = ["serde-compat", "uuid-impl", "serde-json-impl"] }
